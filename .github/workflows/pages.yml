name: Road Pulse · Collect, check and publish
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Collect a fresh complete DriveBC capture
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: roadpulse-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Choose whether to collect
        id: refresh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          MANUAL_REFRESH: ${{ inputs.refresh_data }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          refresh = False
          if os.environ['REF_NAME'] == 'refs/heads/main':
              refresh = os.environ['EVENT_NAME'] == 'schedule' or (os.environ['EVENT_NAME'] == 'workflow_dispatch' and os.environ['MANUAL_REFRESH'] == 'true')
              if os.environ['EVENT_NAME'] == 'push':
                  before = os.environ.get('BEFORE_SHA', '')
                  if not before or set(before) == {'0'}:
                      diff = subprocess.run(['git','ls-tree','-r','--name-only','HEAD'],capture_output=True,text=True,check=True).stdout.splitlines()
                  else:
                      diff = subprocess.run(['git','diff','--name-only',before,'HEAD'],capture_output=True,text=True,check=True).stdout.splitlines()
                  refresh = bool({'web/config.json','scripts/collect.py'} & set(diff))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write(f'collect={str(refresh).lower()}\n')
          PY
      - name: Collect complete DriveBC observations
        id: collect
        if: steps.refresh.outputs.collect == 'true'
        continue-on-error: true
        run: python3 scripts/collect.py
      - name: Explain failed refresh
        if: steps.collect.outcome == 'failure'
        run: |
          echo '::warning::DriveBC collection failed. Publishing the last good retained capture with its original timestamp.'
          echo '### DriveBC refresh failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'The last good capture is retained. Check the collection log; no incomplete observation was published.' >> "$GITHUB_STEP_SUMMARY"
      - name: Test the application and collector
        run: |
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -v
      - name: Build the static application
        run: python3 scripts/build.py
      - name: Install browser test dependencies
        run: |
          python3 -m pip install -r tests/browser-requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Check application in a browser
        run: python3 tests/browser_smoke.py
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: browser-checks/
          retention-days: 7
      - name: Retain successful capture in source history
        if: steps.collect.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add web/data
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Retain dated DriveBC road observations'
            git push origin HEAD:main
          fi
      - name: Save reviewable site
        uses: actions/upload-artifact@v4
        with:
          name: browser-tool-preview
          path: dist/
          include-hidden-files: true
          retention-days: 7
      - name: Package Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
